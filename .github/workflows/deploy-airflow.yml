name: Sync Airflow DAGs to VM

on:
  push:
    branches: [ "park_research" ]
    # dags 폴더가 수정될 때만 실행
    paths:
      - "scripts/airflow/dags/**"
      - "scripts/airflow/docker-compose.yml"
      - ".github/workflows/deploy-airflow.yml"
  workflow_dispatch:
jobs:
  deploy-dags:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy Files to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          # dags와 docker-compose.yml을 모두 복사해야 합니다.
          source: "scripts/airflow/**"
          target: "~/airflow"
          strip_components: 2 # 'scripts/airflow' 경로를 떼고 파일 전송

      - name: Post Deploy Task (Start Airflow)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd ~/airflow
            
            # 1. Airflow 실행에 필요한 환경 변수 세팅
            if [ ! -f .env ]; then
              echo "AIRFLOW_UID=$(id -u)" > .env
            fi
            
            # 2. (최초 1회 필수) Airflow DB 초기화
            # 이미 초기화된 경우에도 실행해도 무방하지만, 리소스를 위해 필요 시에만 수행
            docker compose up airflow-init
            
            # 3. Airflow 전체 서비스 백그라운드 기동
            docker compose up -d
            
            # 4. 결과 확인
            echo "Successfully deployed and started Airflow!"
            docker ps