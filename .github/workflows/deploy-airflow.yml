name: Sync Airflow DAGs to VM

on:
  push:
    branches: [ "park_research" ]
    # dags 폴더가 수정될 때만 실행
    paths:
      - "scripts/airflow/dags/**"
      - "scripts/airflow/docker-compose.yml"
      - ".github/workflows/deploy-airflow.yml"
  workflow_dispatch:
jobs:
  deploy-dags:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy Files to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          # dags와 docker-compose.yml을 모두 복사해야 합니다.
          source: "scripts/airflow/**"
          target: "~/airflow"
          strip_components: 2 # 'scripts/airflow' 경로를 떼고 파일 전송

      - name: Post Deploy Task (Start Airflow)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd ~/airflow
            
            # 1. 환경 변수 설정 (UID 주입)
            if [ ! -f .env ]; then
              echo "AIRFLOW_UID=$(id -u)" > .env
            fi
            
            # 2. 도커 권한을 즉시 적용하여 실행
            # sg docker -c 명령어를 사용하여 그룹 변경 사항을 재로그인 없이 반영합니다.
            sg docker -c "
              docker compose up airflow-init && \
              docker compose up -d
            "
            
            # 3. 배포 결과 최종 확인
            echo "Checking Airflow container status..."
            sg docker -c "docker ps"