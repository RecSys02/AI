name: Build and Deploy to Cloud Run

on:
  push:
    # main 브랜치에 푸시될 때 실행되도록 설정합니다.
    branches: [ "main" ]
    paths:
        - "fastapi_app/**"
        - ".github/workflows/deploy-fastapi.yml"
env:
  PROJECT_ID: gen-lang-client-0492042254
  REGION: asia-northeast3
  REPO_NAME: ai-server
  SERVICE_NAME: ai-server-service
  IMAGE_NAME: app

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. Google Cloud 인증
      # GitHub Secrets에 저장한 GCP_SA_KEY를 사용합니다.
      - id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      # gcloud CLI 사용을 위해 SDK를 명시적으로 설정합니다.
      - name: Set up Google Cloud SDK
        uses: 'google-github-actions/setup-gcloud@v2'
        with:
          project_id: ${{ env.PROJECT_ID }}

      # 2. Docker 설정 및 Artifact Registry 인증
      - name: Docker Auth
        run: |-
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # 3. BuildKit 캐시를 사용하기 위해 buildx를 설정합니다.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. Docker 이미지 빌드 및 푸시 (GitHub Actions 캐시 사용)
      - name: Build and Push Container
        uses: docker/build-push-action@v6
        with:
          context: ./fastapi_app
          file: ./fastapi_app/Dockerfile
          push: true
          tags: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha,scope=fastapi-app
          cache-to: type=gha,mode=max,scope=fastapi-app

      # 5. Cloud Run에 배포
      - name: Deploy to Cloud Run
        id: deploy
        uses: 'google-github-actions/deploy-cloudrun@v2'
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:latest
          flags: --add-cloudsql-instances gen-lang-client-0492042254:asia-northeast3:poi-postgres --remove-env-vars=DETECT_MODEL,LLM_PROVIDER,GEMINI_CHAT_MODEL,GEMINI_RERANK_MODEL
          # 아래 env_vars 섹션에 모든 설정을 추가합니다.
          env_vars: |
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            MILVUS_HOST=${{ secrets.MILVUS_HOST }}
            MILVUS_PORT=19530
            USE_MILVUS=true
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            GOOGLE_GEOCODE_KEY=${{ secrets.GOOGLE_GEOCODE_KEY }}
            GOOGLE_PLACES_KEY=${{ secrets.GOOGLE_PLACES_KEY }}
            LANGFUSE_PUBLIC_KEY=${{ secrets.LANGFUSE_PUBLIC_KEY }}
            LANGFUSE_SECRET_KEY=${{ secrets.LANGFUSE_SECRET_KEY }}
            CLOVA_KEY=${{ secrets.CLOVA_KEY }}
            LANGFUSE_BASE_URL=https://us.cloud.langfuse.com
            RERANK_METRICS_LOG=true
            LANGFUSE_DEBUG=1
            RERANK_PROVIDER=clova
            RERANK_MODEL=HCX-DASH-002
            CHAT_PROVIDER=gemini
            CHAT_MODEL=gemini-2.0-flash
            PYTHONUNBUFFERED=1
            PYTHONDONTWRITEBYTECODE=1


      # 6. 배포된 서비스 URL 출력
      - name: Show Output
        run: echo ${{ steps.deploy.outputs.url }}
